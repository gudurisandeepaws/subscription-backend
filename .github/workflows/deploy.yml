name: Deploy Backend Infrastructure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Assuming the workflow is run from the root of the repo, and the code is in the 'backend' folder.
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Lambda Dependencies
        run: |
          cd src/create-subscription && npm install
          cd ../..
          cd src/webhook && npm install
          cd ../..
          cd src/check-subscription && npm install
          cd ../..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./backend/terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./backend/terraform
        env:
          TF_VAR_razorpay_key_id: ${{ secrets.RAZORPAY_KEY_ID }}
          TF_VAR_razorpay_key_secret: ${{ secrets.RAZORPAY_KEY_SECRET }}
          TF_VAR_razorpay_webhook_secret: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          TF_VAR_razorpay_plan_id: ${{ secrets.PLAN_ID }}
        run: terraform apply -auto-approve
